<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self';" />
    <link rel="stylesheet" href="style.css" />
    <title>Claude Crab</title>
  </head>
  <body>
    <div id="stage-root" data-happy="false">
      <!-- Speech bubble with stats -->
      <div id="bubble" class="bubble">
        <button id="close" title="Hide (bring back from the menu-bar crab)">×</button>
        <div class="bubble-head">
          <span id="b-emoji" class="b-emoji">🥚</span>
          <span id="b-stage">Egg</span>
        </div>
        <div class="bubble-big"><b id="b-count">0</b> <span class="unit">commits raised</span></div>
        <div class="bubble-sub">
          <span class="pill"><span id="b-today">0</span> today</span>
          <span class="pill"><span id="b-week">0</span> this week</span>
        </div>
        <div class="progress"><div id="b-bar" class="progress-fill"></div></div>
        <div class="bubble-next" id="b-next">…</div>
        <div class="bubble-foot"><span id="b-life">0</span> lifetime · <span id="b-repos">0</span> repos</div>
      </div>

      <!-- The pet artwork is injected here from the selected pet pack. -->
      <div id="pet" class="pet"></div>
    </div>
    <script src="pet.js"></script>
  </body>
</html>

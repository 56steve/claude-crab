<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
    <link rel="stylesheet" href="style.css" />
    <title>Claude Crab</title>
  </head>
  <body>
    <div id="stage-root" class="stage-egg" data-happy="false">
      <!-- Speech bubble with stats -->
      <div id="bubble" class="bubble">
        <button id="close" title="Hide (bring back from the menu-bar crab)">×</button>
        <div class="bubble-head">
          <span id="b-emoji" class="b-emoji">🥚</span>
          <span id="b-stage">Egg</span>
        </div>
        <div class="bubble-big"><b id="b-count">0</b> <span class="unit">commits raised</span></div>
        <div class="bubble-sub">
          <span class="pill"><span id="b-today">0</span> today</span>
          <span class="pill"><span id="b-week">0</span> this week</span>
        </div>
        <div class="progress"><div id="b-bar" class="progress-fill"></div></div>
        <div class="bubble-next" id="b-next">…</div>
        <div class="bubble-foot"><span id="b-life">0</span> lifetime · <span id="b-repos">0</span> repos</div>
      </div>

      <!-- The pet -->
      <div id="pet" class="pet">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- body sheen -->
            <linearGradient id="pixOrange" gradientUnits="userSpaceOnUse" x1="100" y1="46" x2="100" y2="172">
              <stop offset="0%" stop-color="#f5814f" />
              <stop offset="55%" stop-color="#f26a3d" />
              <stop offset="100%" stop-color="#e85e2f" />
            </linearGradient>
            <!-- dark outer outline + light inner rim, following the union of all body parts -->
            <filter id="pix-outline" x="-25%" y="-25%" width="150%" height="150%">
              <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d1" />
              <feFlood flood-color="#9e3117" result="c1" />
              <feComposite in="c1" in2="d1" operator="in" result="dark" />
              <feMorphology in="SourceAlpha" operator="dilate" radius="2.4" result="d2" />
              <feFlood flood-color="#ffb98f" result="c2" />
              <feComposite in="c2" in2="d2" operator="in" result="rim" />
              <feMerge>
                <feMergeNode in="dark" />
                <feMergeNode in="rim" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="5" result="b" />
              <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
            <!-- fire form (10+ commits) -->
            <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#e0400f" />
              <stop offset="45%" stop-color="#ff7a12" />
              <stop offset="100%" stop-color="#ffd24a" />
            </linearGradient>
            <linearGradient id="flameCore" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#ff8a1e" />
              <stop offset="100%" stop-color="#fff0a8" />
            </linearGradient>
            <linearGradient id="pixFire" gradientUnits="userSpaceOnUse" x1="100" y1="46" x2="100" y2="172">
              <stop offset="0%" stop-color="#ff7a2e" />
              <stop offset="100%" stop-color="#d8431a" />
            </linearGradient>
            <radialGradient id="fireGlow" cx="50%" cy="55%" r="55%">
              <stop offset="0%" stop-color="#ff8c1e" stop-opacity="0.55" />
              <stop offset="60%" stop-color="#ff5a0a" stop-opacity="0.20" />
              <stop offset="100%" stop-color="#ff5a0a" stop-opacity="0" />
            </radialGradient>
            <!-- inferno goggles lens -->
            <linearGradient id="goggleLens" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffe27a" />
              <stop offset="45%" stop-color="#ff6a1a" />
              <stop offset="100%" stop-color="#c81e10" />
            </linearGradient>
          </defs>

          <!-- ground shadow -->
          <ellipse class="shadow" cx="100" cy="182" rx="56" ry="10" />

          <!-- ===================== EGG (stage 0) ===================== -->
          <g class="egg-only">
            <g class="egg-shake">
              <ellipse class="egg-body" cx="100" cy="104" rx="40" ry="50" />
              <ellipse class="egg-gloss" cx="86" cy="86" rx="12" ry="18" />
              <circle class="egg-speck" cx="112" cy="118" r="4" />
              <circle class="egg-speck" cx="90" cy="132" r="3" />
              <circle class="egg-speck" cx="116" cy="92" r="2.6" />
              <!-- cracks (appear at 2 commits) -->
              <path class="egg-crack" d="M78 96 l10 8 l-8 9 l12 7 l-9 9" />
              <path class="egg-crack" d="M122 84 l-9 9 l9 8 l-11 8 l8 9" />
              <path class="egg-crack" d="M100 60 l-6 12 l8 6 l-6 10" />
            </g>
          </g>

          <!-- ===================== PIXEL CRAB ===================== -->
          <g class="crab-only">
            <!-- fire form (only shown at the Blaze stage) -->
            <g class="fire">
              <ellipse class="fire-glow" cx="100" cy="102" rx="86" ry="96" />
              <path class="flame side fL" d="M21,104 Q20,84 30,66 Q40,84 39,104 Q35,99 30,101 Q25,99 21,104 Z" />
              <path class="flame side fR" d="M161,104 Q160,84 170,66 Q180,84 179,104 Q175,99 170,101 Q165,99 161,104 Z" />
              <path class="flame f4" d="M46,58 Q44,44 56,30 Q68,44 66,58 Q61,54 56,56 Q51,54 46,58 Z" />
              <path class="flame f5" d="M132,58 Q130,43 144,28 Q158,43 156,58 Q151,54 144,56 Q137,54 132,58 Z" />
              <path class="flame f2" d="M62,56 Q60,36 76,16 Q92,36 90,56 Q83,51 76,54 Q69,51 62,56 Z" />
              <path class="flame f3" d="M110,56 Q108,34 124,14 Q140,34 138,56 Q131,51 124,54 Q117,51 110,56 Z" />
              <path class="flame f7" d="M79,56 Q78,44 88,34 Q98,44 97,56 Q93,52 88,54 Q83,52 79,56 Z" />
              <path class="flame f8" d="M103,56 Q102,43 112,32 Q122,43 121,56 Q117,52 112,54 Q107,52 103,56 Z" />
              <path class="flame f1" d="M76,56 Q74,30 100,4 Q126,30 124,56 Q112,50 100,54 Q88,50 76,56 Z" />
              <path class="flame core f6" d="M88,54 Q86,36 100,18 Q114,36 112,54 Q106,49 100,52 Q94,49 88,54 Z" />
              <rect class="ember e1" x="46" y="40" width="5" height="5" />
              <rect class="ember e2" x="150" y="44" width="5" height="5" />
              <rect class="ember e3" x="70" y="16" width="4" height="4" />
              <rect class="ember e4" x="128" y="20" width="4" height="4" />
              <rect class="ember e5" x="100" y="4" width="4" height="4" />
              <rect class="ember e6" x="38" y="72" width="4" height="4" />
              <rect class="ember e7" x="162" y="88" width="5" height="5" />
              <rect class="ember e8" x="150" y="120" width="4" height="4" />
            </g>

            <!-- one filtered union = orange body with dark outline + light rim -->
            <g class="pix" filter="url(#pix-outline)">
              <rect class="pix-fill" x="44" y="52" width="112" height="92" />
              <rect class="pix-fill" x="20" y="76" width="28" height="30" />
              <rect class="pix-fill" x="152" y="76" width="28" height="30" />
              <rect class="pix-fill" x="44" y="132" width="16" height="34" />
              <rect class="pix-fill" x="72" y="132" width="16" height="34" />
              <rect class="pix-fill" x="112" y="132" width="16" height="34" />
              <rect class="pix-fill" x="140" y="132" width="16" height="34" />
            </g>

            <!-- eyes -->
            <g class="eyes">
              <rect class="eye" x="59" y="67" width="18" height="18" />
              <rect class="eye" x="123" y="67" width="18" height="18" />
            </g>

            <!-- goggles (Inferno, 30+ commits) -->
            <g class="goggles">
              <rect class="ggl-strap" x="34" y="70" width="134" height="30" rx="14" />
              <rect class="ggl-lens" x="44" y="74" width="52" height="22" rx="9" />
              <rect class="ggl-lens" x="104" y="74" width="52" height="22" rx="9" />
              <path class="ggl-shine" d="M52 93 L66 77" />
              <path class="ggl-shine" d="M61 93 L75 77" />
              <path class="ggl-shine" d="M112 93 L126 77" />
              <path class="ggl-shine" d="M121 93 L135 77" />
              <rect class="ggl-buckle" x="160" y="79" width="9" height="12" rx="2" />
            </g>

            <!-- lightning (Inferno) -->
            <g class="lightning">
              <g class="bolt-set b1">
                <polyline class="glow" points="30,18 43,48 33,52 50,88" />
                <polyline class="core" points="30,18 43,48 33,52 50,88" />
              </g>
              <g class="bolt-set b2">
                <polyline class="glow" points="172,22 159,50 169,54 152,90" />
                <polyline class="core" points="172,22 159,50 169,54 152,90" />
              </g>
              <g class="bolt-set b3">
                <polyline class="glow" points="12,98 30,112 21,118 38,134" />
                <polyline class="core" points="12,98 30,112 21,118 38,134" />
              </g>
            </g>
          </g>

          <!-- sparkle burst on hatch / commit -->
          <g class="sparkles">
            <text class="spark" x="34" y="66">✦</text>
            <text class="spark" x="160" y="58">✧</text>
            <text class="spark" x="164" y="126">✦</text>
            <text class="spark" x="30" y="120">✧</text>
            <text class="spark" x="100" y="40">✦</text>
          </g>
        </svg>
      </div>
    </div>
    <script src="pet.js"></script>
  </body>
</html>

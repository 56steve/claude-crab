<style>
  /* ---- pixel crab coloring ---- */
  .shadow    { display: none; }
  .pix-fill  { fill: url(#pixOrange); }
  .eye       { fill: #201d1b; }
  .eye-shine { fill: #ffffff; }

  /* ---- fire form (Blaze, Inferno) ---- */
  .fire { display: none; }
  .stage-blaze .fire, .stage-inferno .fire { display: block; }
  .stage-blaze .pix-fill, .stage-inferno .pix-fill { fill: url(#pixFire); }

  /* ---- inferno extras: goggles + lightning ---- */
  .goggles, .lightning { display: none; }
  .stage-inferno .goggles, .stage-inferno .lightning { display: block; }
  .stage-inferno .eyes { display: none; }
  .ggl-strap  { fill: #241611; stroke: #12100d; stroke-width: 1.5; }
  .ggl-lens   { fill: url(#goggleLens); stroke: #3a2416; stroke-width: 2; }
  .ggl-shine  { stroke: #fff3c0; stroke-width: 3; stroke-linecap: round; opacity: .85; }
  .ggl-buckle { fill: #3a2416; }
  .glow { fill: none; stroke: #ffdf6a; stroke-width: 6; opacity: .45; stroke-linejoin: round; stroke-linecap: round; }
  .core { fill: none; stroke: #fff8d8; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .bolt-set { opacity: 0; }
  .stage-inferno .bolt-set    { animation: zap 1.2s steps(1, end) infinite; }
  .stage-inferno .bolt-set.b2 { animation-duration: 1.5s; animation-delay: .4s; }
  .stage-inferno .bolt-set.b3 { animation-duration: 1.05s; animation-delay: .7s; }
  @keyframes zap { 0%,15% { opacity: 1; } 19%,100% { opacity: 0; } }
  .flame { fill: url(#flame); transform-box: fill-box; transform-origin: 50% 100%; animation: flick 0.55s ease-in-out infinite alternate; }
  .flame.core { fill: url(#flameCore); }
  .flame.f2 { animation-delay: .08s; animation-duration: .42s; }
  .flame.f3 { animation-delay: .16s; animation-duration: .48s; }
  .flame.f4 { animation-delay: .05s; animation-duration: .50s; }
  .flame.f5 { animation-delay: .20s; animation-duration: .40s; }
  .flame.f6 { animation-delay: .12s; animation-duration: .38s; }
  .flame.f7 { animation-delay: .22s; animation-duration: .46s; }
  .flame.f8 { animation-delay: .1s;  animation-duration: .43s; }
  .flame.fL { animation-duration: .46s; }
  .flame.fR { animation-delay: .15s; animation-duration: .44s; }
  @keyframes flick {
    0%   { transform: scaleY(.88) scaleX(1.04); opacity: .85; }
    100% { transform: scaleY(1.14) scaleX(.94) translateY(-2px); opacity: 1; }
  }
  .fire-glow { display: none; }
  .ember { fill: #ffae4d; transform-box: fill-box; animation: rise 1.7s linear infinite; }
  .ember.e2 { animation-delay: .5s; } .ember.e3 { animation-delay: .9s; }
  .ember.e4 { animation-delay: .3s; } .ember.e5 { animation-delay: 1.2s; }
  .ember.e6 { animation-delay: .7s; } .ember.e7 { animation-delay: .2s; }
  .ember.e8 { animation-delay: 1.0s; }
  @keyframes rise { 0% { transform: translateY(8px); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }

  /* ---- egg ---- */
  .egg-body  { fill: #fbecd6; stroke: #cf7a3a; stroke-width: 5; }
  .egg-gloss { fill: #ffffff; opacity: 0.5; }
  .egg-speck { fill: #e6a86a; opacity: 0.7; }
  .egg-crack { fill: none; stroke: #9a5a28; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 0.3s; }
  #stage-root.cracking .egg-crack { opacity: 1; }

  /* show egg vs crab */
  .crab-only { display: none; }
  .egg-only  { display: none; }
  .stage-egg .egg-only { display: block; }
  #stage-root:not(.stage-egg) .crab-only { display: block; }

  /* per-stage scale */
  .stage-egg .pet       { scale: 0.38; }
  .stage-hatchling .pet { scale: 0.42; }
  .stage-blaze .pet     { scale: 0.48; }
  .stage-inferno .pet   { scale: 0.54; }

  /* keep the bubble clear of the flames on fiery forms */
  .stage-blaze .bubble { bottom: 104px; }
  .stage-inferno .bubble { bottom: 112px; }

  /* arms wave */
  .pix-fill:nth-child(2) { transform-box: fill-box; transform-origin: right center; animation: armL 2.2s ease-in-out infinite; }
  .pix-fill:nth-child(3) { transform-box: fill-box; transform-origin: left center; animation: armR 2.2s ease-in-out infinite; }
  @keyframes armL { 0%,100%{ rotate: 0deg; } 50%{ rotate: -7deg; } }
  @keyframes armR { 0%,100%{ rotate: 0deg; } 50%{ rotate: 7deg; } }

  /* eyes blink */
  .eye { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blink { 0%,93%,100%{ scale: 1 1; } 96%{ scale: 1 0.12; } }

  /* egg wobble while cracking */
  #stage-root.cracking .egg-shake { transform-box: fill-box; transform-origin: 100px 150px; animation: wobble 0.45s ease-in-out infinite; }
  @keyframes wobble { 0%,100%{ rotate: -3.5deg; } 50%{ rotate: 3.5deg; } }

  /* hatch pop when egg -> crab */
  #stage-root.hatch .crab-only { transform-box: view-box; transform-origin: 100px 150px; animation: pop 0.8s cubic-bezier(.2,1.35,.35,1); }
  @keyframes pop { 0%{ scale: 0; } 55%{ scale: 1.18; } 78%{ scale: 0.94; } 100%{ scale: 1; } }

  /* sparkles when happy/hatching */
  .sparkles { opacity: 0; }
  .spark { fill: #ffd15c; font-size: 20px; }
  #stage-root[data-happy="true"] .sparkles { animation: sparkle 1.4s ease-out; }
  @keyframes sparkle { 0%{ opacity:0; scale:0.4; } 30%{ opacity:1; scale:1.15; } 100%{ opacity:0; scale:0.85; } }

  /* happy dance (commit reaction, once hatched) */
  #stage-root[data-happy="true"]:not(.stage-egg):not(.hatch) .pet { animation: dance 0.55s ease-in-out 3; }
  @keyframes dance {
    0%,100% { rotate: 0deg; translate: 0 0; }
    25% { rotate: -8deg; translate: 0 -10px; }
    75% { rotate: 8deg; translate: 0 -10px; }
  }
</style>
